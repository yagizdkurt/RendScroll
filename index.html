<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RendScroll</title>
<!-- Fonts are bundled locally (src/assets/fonts/) so normal use needs no
     network; see src/styles/fonts.css. -->
<link rel="stylesheet" href="src/styles/fonts.css">
<link rel="stylesheet" href="src/style.css">
<link rel="stylesheet" href="src/editor/editor.css">
<link rel="stylesheet" href="src/printer/printer.css">
<!-- Per-engine print deltas (scoped by data-print-engine; printer.css is the
     untouched Chromium printer). Loaded after printer.css so they win. -->
<link rel="stylesheet" href="src/printer/printer.firefox.css">
<link rel="stylesheet" href="src/printer/printer.webkit.css">
<link rel="stylesheet" href="src/debug/debugPanel.css">
<link rel="stylesheet" href="src/sceneGraph/sceneGraph.css">
<link rel="stylesheet" href="src/campaign/campaignManager.css">
</head>
<body>
  <aside id="sidebar">
    <button id="sidebar-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true">☰</button>
    <div class="nav-campaign-name" id="nav-campaign-name"></div>
    <div class="nav-section-title" id="nav-campaign-title">Scenes</div>
    <nav id="nav"></nav>
    <div class="nav-section-title" id="nav-lore-title">Lore</div>
    <nav id="lore-nav" aria-label="Lore"></nav>
    <div class="nav-section-title" id="nav-library-title">Items</div>
    <nav id="library-nav" aria-label="Items"></nav>
    <div class="nav-section-title" id="nav-enemies-title">Enemies</div>
    <nav id="enemies-nav" aria-label="Enemies"></nav>
    <section id="options" class="options" aria-label="Options"></section>
  </aside>
  <div id="main-area">
    <header id="topbar">
      <div id="topbar-primary">
        <button id="new-page-button" class="topbar-action topbar-new-page" type="button" aria-label="Add">+</button>
        <button id="manage-campaigns-button" class="topbar-action topbar-manage-campaigns" type="button">⚑ Manage Campaigns</button>
      </div>
      <div id="topbar-search"></div>
      <div id="topbar-tools"></div>
    </header>
    <main id="reader">
      <article id="page" class="page"></article>
    </main>
  </div>
  <script src="src/vendor/marked.min.js"></script>
  <!-- Guarded localStorage wrapper + browser engine detection. Loaded first so
       every later script can rely on SafeStorage / BrowserEnv. -->
  <script src="src/utils/safeStorage.js"></script>
  <script src="src/utils/browserEnv.js"></script>
  <script src="src/Options/rendererOptions.js"></script>
  <script src="src/utils/text.js"></script>
  <script src="src/utils/markdown.js"></script>
  <!-- Campaign-stamping request helpers: appends the active campaign to the
       stateless /__ endpoints. Must load before refLibrary.js and the app. -->
  <script src="src/utils/serverApi.js"></script>
  <!-- POST /__save wrapper. Reader-owned: the New Page / Edit Manifest dialogs
       and the editor both write scene markdown through it. -->
  <script src="src/utils/sceneSave.js"></script>
  <!-- Shared runtime warning sink. Loaded early so startup, library, campaign,
       and options failures can be surfaced later by the debug panel. -->
  <script src="src/debug/rsLog.js"></script>
  <!-- Per-campaign live table state (combat runner v1), persisted outside scene
       markdown in campaigns/<Name>/.sys/session.json. -->
  <script src="src/session/sessionState.js"></script>
  <!-- Per-campaign editor drafts, persisted in campaigns/<Name>/.sys/drafts.json. -->
  <script src="src/session/draftState.js"></script>
  <!-- RendScroll structural parser: canonical model consumed by the editor now
       and (Phase 2) the renderer. Must load before outline.js / cardSchemas.js. -->
  <script src="src/parser/rendscrollParser.js"></script>
  <!-- Reusable reference library (Items, …): loads standalone library files and
       resolves SourceItem-backed items / [link=Name] references. Needs the
       parser; used by app.js and the editor. -->
  <script src="src/refLibrary.js"></script>
  <script src="src/cards/shared/skillCheckRules.js"></script>
  <script src="src/inlineFormatting.js"></script>
  <script src="src/markdown.js"></script>
  <script src="src/cards/shared/cardImage.js"></script>
  <!-- AST card-node accessors (directives / column / body lines) used by the
       builders to read the parsed model instead of re-sniffing the DOM. -->
  <script src="src/cards/shared/cardDirectives.js"></script>
  <script src="src/cards/shared/StdIcons.js"></script>
  <!-- Shared dice/damage model + renderer (combat attacks and item damage) and
       the DnD 5e item-type vocabulary. Load before the card builders that use them. -->
  <script src="src/cards/shared/damageModel.js"></script>
  <script src="src/cards/shared/damageRender.js"></script>
  <script src="src/cards/shared/itemTypes.js"></script>
  <script src="src/cards/shared/cardParts.js"></script>
  <!-- Runtime card registry: each card builder below self-registers here; app.js
       looks builders/normalizers up by type. Must load before the builders. -->
  <script src="src/cards/shared/cardRegistry.js"></script>
  <script src="src/cards/skillChecks/skillChecks.js"></script>
  <script src="src/cards/npc/npc.js"></script>
  <script src="src/cards/item/item.js"></script>
  <script src="src/cards/ability/ability.js"></script>
  <script src="src/cards/obj/obj.js"></script>
  <!-- Combat: model -> stat-block render -> live runner -> card builder.
       Each layer only calls the ones above it; combatRunner.js is the only
       file in cards/ that touches SessionState. -->
  <script src="src/cards/combat/enemyModel.js"></script>
  <script src="src/cards/combat/enemyRoster.js"></script>
  <script src="src/cards/combat/combatRunner.js"></script>
  <script src="src/cards/combat/combat.js"></script>
  <script src="src/cards/unexpected/unexpected.js"></script>
  <script src="src/cards/narrative/narrative.js"></script>
  <script src="src/cards/std/std.js"></script>
  <script src="src/cards/manifest/manifest.js"></script>
  <script src="src/cards/picture/picture.js"></script>
  <script src="src/cards/audio/audio.js"></script>
  <script src="src/cards/transition/transition.js"></script>
  <!-- Classification-only type: no builder, only a heading accent. -->
  <script src="src/cards/echo/echo.js"></script>
  <script src="src/cards/shared/cardCollapse.js"></script>
  <!-- "LoreRef:" chips in the card head. Runs after the collapse pass (it needs the
       head that pass builds) and uses LoreModel's address grammar at render time. -->
  <script src="src/cards/shared/cardLoreRefs.js"></script>
  <script src="src/cards/shared/layout.js"></script>
  <!-- Card-source -> card-element rendering, extracted from app.js so it can be
       tested against real code. Declaration-only; must load before the app
       subsystems (appLibrary / refNavigation) and app.js that call it. -->
  <script src="src/app/renderCard.js"></script>
  <!-- Scene Manifest read/write over the parser AST (no editor dependency).
       Used by the New Page / Edit Manifest dialogs in appModals.js. -->
  <script src="src/app/sceneManifest.js"></script>
  <!-- Lore: campaign-scoped multi-entry pages. loreModel.js is pure; loreView.js
       renders a page and is reader-only (the editor half loads with the editor). -->
  <script src="src/lore/loreModel.js"></script>
  <script src="src/lore/loreView.js"></script>
  <!-- Multi-campaign manager: lists/creates/switches/imports/exports campaigns and
       owns the start screen. Needs refLibrary.js; used by app.js boot, so load it
       before app.js. (Export uses CampaignExporter lazily, which loads later.) -->
  <script src="src/campaign/campaignManager.js"></script>
  <!-- Reader subsystems split out of app.js. All declaration-only globals; must
       load BEFORE app.js, whose init() (run at load) calls into them.
       readerState.js owns the state + shell elements they all share. -->
  <script src="src/app/readerState.js"></script>
  <script src="src/app/appModals.js"></script>
  <script src="src/app/appSidebar.js"></script>
  <script src="src/app/appLibrary.js"></script>
  <script src="src/app/refNavigation.js"></script>
  <script src="src/app/appSearch.js"></script>
  <script src="src/updates/updateNotice.js"></script>
  <script src="src/assets/assetInventory.js"></script>
  <script src="src/app/app.js"></script>
  <!-- Editor mode (optional layer; reader is untouched when disabled) -->
  <!-- One editing session (undo / dirty / Save / navigation guard / toolbar)
       shared by the scene editor and the Lore editor. -->
  <script src="src/editor/docSession.js"></script>
  <script src="src/editor/outline.js"></script>
  <script src="src/editor/cardSchemas.js"></script>
  <script src="src/editor/anchors.js"></script>
  <script src="src/editor/dragDrop.js"></script>
  <script src="src/editor/contextMenu.js"></script>
  <!-- Shared damage-parts editor: reused by the combat attack editor (form.js)
       and the item Damage field. Must load before form.js. -->
  <script src="src/editor/damageEditor.js"></script>
  <script src="src/editor/form.js"></script>
  <script src="src/editor/assetPicker.js"></script>
  <script src="src/cards/skillChecks/skillChecks.editor.js"></script>
  <!-- Item editor fields (Type picker + Damage). Registers with form.js. -->
  <script src="src/cards/item/item.editor.js"></script>
  <!-- Lore attachment picker for the card "Lore" field. Registers with form.js. -->
  <script src="src/lore/lore.editor.js"></script>
  <!-- Item Library picker: choose an existing library item (or create a new one)
       when inserting a SourceItem-backed scene Item. Needs form.js + refLibrary.js. -->
  <script src="src/editor/libraryPicker.js"></script>
  <!-- Lore document editing: registers a lore page with EditorDocSession. -->
  <script src="src/lore/loreEditor.js"></script>
  <script src="src/editor/editor.js"></script>
  <!-- Campaign package exporter: bundles scenes + referenced items/enemies +
       assets into a zip. Needs refLibrary.js + the card asset rules; used by the
       printer dropdown's "Export Package" action, so load it before printer.js. -->
  <script src="src/exporter/exporter.js"></script>
  <!-- Printer mode (export-only; reads the rendered #page, changes nothing).
       Per-engine overrides self-register first so printer.js can look them up. -->
  <script src="src/printer/printer.firefox.js"></script>
  <script src="src/printer/printer.webkit.js"></script>
  <script src="src/printer/printer.js"></script>
  <!-- Debug panel (dev-only; read-only parser diagnostics, excluded from print) -->
  <script src="src/debug/diagnostics.js"></script>
  <script src="src/debug/debugPanel.js"></script>
  <!-- Scene progression map: right-side dock showing scene->scene flow (manual
       edges in campaigns/<Name>/graph.json + locked edges derived from Transition
       cards). Pure model first, panel second — order is load-bearing. -->
  <script src="src/sceneGraph/graphGeometry.js"></script>
  <script src="src/sceneGraph/graphModel.js"></script>
  <script src="src/sceneGraph/sceneGraph.js"></script>
</body>
</html>
